<title>Dr. Thennavan M has moved to www.thennavan-m.com</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://www.thennavan-m.com/">
<script>
  // www.drmthennav.com is the old address. Send every visitor to the same
  // page on the new site when it exists, otherwise to the home page.
  (function () {
    var pages = ['research', 'projects', 'publications', 'teaching', 'cv', 'contact'];
    var first = location.pathname.split('/').filter(Boolean)[0] || '';
    first = first.toLowerCase();
    var path = pages.indexOf(first) >= 0 ? '/' + first + '/' : '/';
    location.replace('https://www.thennavan-m.com' + path);
  })();
</script>
